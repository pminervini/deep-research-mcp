[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research-mcp"
version = "0.2.0"
description = "MCP server and agent for autonomous deep research workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Deep Research MCP Contributors" }]
dependencies = [
    "filelock>=3.20.0,<4",
    "google-genai>=2.2.0",
    "httpx>=0.25.0",
    # Stay on stable v1 until we deliberately migrate across v2's breaking changes.
    # https://github.com/modelcontextprotocol/python-sdk
    "mcp[cli]>=1.28.1,<2",
    "openai>=1.88",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.1.0",
    "tenacity>=8.2.0",
    "textual>=8.2.3",
]

[project.optional-dependencies]
dev = [
    "black>=23.7.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
    "pylint>=2.17.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.2.0",
]
open-deep-research = [
    "open-deep-research @ git+https://github.com/pminervini/open-deep-research.git",
]

[project.scripts]
deep-research-cli = "deep_research_mcp.cli:main"
deep-research-mcp = "deep_research_mcp.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pylint.main]
fail-under = 10

[tool.pylint.format]
max-line-length = 240

[tool.pylint."messages control"]
disable = [
    "broad-exception-caught",
    "consider-using-from-import",
    "duplicate-code",
    "global-statement",
    "global-variable-not-assigned",
    "import-error",
    "import-outside-toplevel",
    "invalid-name",
    "logging-fstring-interpolation",
    "missing-function-docstring",
    "no-name-in-module",
    "redefined-outer-name",
    "singleton-comparison",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-positional-arguments",
    "too-many-statements",
    "unused-argument",
    "unused-variable",
    "wrong-import-order",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "huggingface_hub",
    "open_deep_research.*",
    "smolagents",
]
ignore_missing_imports = true
